# rust-toolchain.toml
#
# Pins the Rust toolchain version for reproducible WASM builds.
#
# Why this matters for soroban-verify:
# The registry contract's WASM hash is computed from the compiled bytes.
# Different Rust versions can produce different codegen, which means the
# same source code can produce a different WASM hash on different machines.
# Pinning the toolchain ensures that anyone who checks out this repo and
# runs `cargo build` gets a binary that matches the on-chain WASM hash.
#
# Current version: 1.91.0 (minimum required by soroban-sdk@27.0.6)
#
# To update:
#   1. Change the channel value below
#   2. Run: rustup update
#   3. Run: cargo test --manifest-path contracts/registry/Cargo.toml
#   4. If tests pass: redeploy the contract and update REGISTRY_*_ID
#   5. Update EMMY_CHANGELOG.md with the change
[toolchain]
channel = "1.91.0"
targets = ["wasm32v1-none"]
