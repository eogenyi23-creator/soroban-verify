name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Rust: build and test the registry contract
  # ──────────────────────────────────────────────────────────────────────────
  contract:
    name: Contract (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path contracts/registry/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --manifest-path contracts/registry/Cargo.toml --target wasm32v1-none -- -D warnings

      - name: Run contract tests
        run: cargo test --manifest-path contracts/registry/Cargo.toml

      - name: Build WASM release
        run: cargo build --manifest-path contracts/registry/Cargo.toml --target wasm32v1-none --release

  # ──────────────────────────────────────────────────────────────────────────
  # TypeScript: build, lint, and test SDK + CLI
  # ──────────────────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript (SDK + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build
        working-directory: sdk

      - name: Build CLI
        run: pnpm build
        working-directory: cli

      - name: Lint SDK
        run: pnpm lint
        working-directory: sdk

      - name: Lint CLI
        run: pnpm lint
        working-directory: cli

      - name: Test SDK
        run: pnpm test
        working-directory: sdk

      - name: Test CLI
        run: pnpm test
        working-directory: cli

  # ──────────────────────────────────────────────────────────────────────────
  # Next.js: lint, test, and build the web frontend
  # ──────────────────────────────────────────────────────────────────────────
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build
        working-directory: sdk

      - name: Lint web
        run: pnpm lint
        working-directory: web

      - name: Test web
        run: pnpm test
        working-directory: web

      - name: Build web
        run: pnpm build
        working-directory: web
        env:
          REGISTRY_TESTNET_ID: ${{ vars.REGISTRY_TESTNET_ID || 'placeholder' }}
          REGISTRY_MAINNET_ID: ${{ vars.REGISTRY_MAINNET_ID || 'placeholder' }}
 
