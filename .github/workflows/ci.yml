name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Rust: build and test the registry contract
  # ──────────────────────────────────────────────────────────────────────────
  contract:
    name: Contract (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run contract tests
        run: cargo test --manifest-path contracts/registry/Cargo.toml

      - name: Build WASM release
        run: cargo build --manifest-path contracts/registry/Cargo.toml --target wasm32v1-none --release

  # ──────────────────────────────────────────────────────────────────────────
  # TypeScript: build and test SDK + CLI
  # ──────────────────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript (SDK + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install SDK dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: sdk

      - name: Build SDK
        run: pnpm build
        working-directory: sdk

      - name: Install CLI dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: cli

      - name: Build CLI
        run: pnpm build
        working-directory: cli

      - name: Run CLI tests
        run: pnpm test
        working-directory: cli

  # ──────────────────────────────────────────────────────────────────────────
  # Next.js: lint and build the web frontend
  # ──────────────────────────────────────────────────────────────────────────
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install SDK dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: sdk

      - name: Build SDK
        run: pnpm build
        working-directory: sdk

      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: web

      - name: Lint
        run: pnpm lint
        working-directory: web
        continue-on-error: true

      - name: Build
        run: pnpm build
        working-directory: web
        env:
          REGISTRY_TESTNET_ID: ${{ vars.REGISTRY_TESTNET_ID || 'placeholder' }}
          REGISTRY_MAINNET_ID: ${{ vars.REGISTRY_MAINNET_ID || 'placeholder' }}
